  - {name: ch21 - rack 21, trigger: {type: channel_select, strip: ch21}, rack: 21}
  - {name: ch22 - rack 22, trigger: {type: channel_select, strip: ch22}, rack: 22}
  - {name: ch23 - rack 23, trigger: {type: channel_select, strip: ch23}, rack: 23}
  - {name: ch24 - rack 24, trigger: {type: channel_select, strip: ch24}, rack: 24}
  - {name: ch25 - rack 25, trigger: {type: channel_select, strip: ch25}, rack: 25}
  - {name: ch26 - rack 26, trigger: {type: channel_select, strip: ch26}, rack: 26}
